name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: >-
        Use invented data only. Do not attach real medical records, identifiers,
        credentials, or private logs. For vulnerabilities, follow SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce with synthetic data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device and version
      description: Phone, OS version, app revision, and model version if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic example or safe logs
      description: Include airplane-mode behavior if the problem concerns local processing.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I used only synthetic data and removed credentials and identifiers.
          required: true
